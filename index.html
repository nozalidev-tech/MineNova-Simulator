<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

           //firebase//

 
const firebaseConfig = {
  apiKey: "AIzaSyDf5BDxRH5V5LQkOGt5wOP-6mrIGOPk2TU",
  authDomain: "minenova-simulator.firebaseapp.com",
  projectId: "minenova-simulator",
  storageBucket: "minenova-simulator.firebasestorage.app",
  messagingSenderId: "73831734825",
  appId: "1:73831734825:web:019674918d83ab98158638"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);
window.firebaseAuth = auth;
window.firebaseSignOut = signOut;

console.log("✅ Firebase Connected");
const provider = new GoogleAuthProvider();
// ===============================
// KEEP USER LOGGED IN AFTER REFRESH
// ===============================

onAuthStateChanged(auth, async (user) => {

    if (user) {

        console.log("✅ User Already Logged In");

        const homeName = document.getElementById("username");

        if (homeName) {
            homeName.innerText = user.displayName;
        }

        const profileName = document.getElementById("profileName");

        if (profileName) {
            profileName.innerText = user.displayName;
        }

    } else {

    console.log("❌ User Not Logged In");

    const homeName = document.getElementById("username");

    if (homeName) {
        homeName.innerText = "User Name";
    }

    const profileName = document.getElementById("profileName");

    if (profileName) {
        profileName.innerText = "User Name";
    }



    }

});

const googleBtn = document.getElementById("googleLoginBtn");
if (googleBtn) {
googleBtn.addEventListener("click", async () => {

    try{

        const result = await signInWithPopup(auth, provider);

        const user = result.user;
        const homeName = document.getElementById("username");

if (homeName) {
    homeName.innerText = user.displayName;
}

const profileName = document.getElementById("profileName");

if (profileName) {
    profileName.innerText = user.displayName;
}

const userRef = doc(db, "users", user.uid);
localStorage.setItem("uid", user.uid);

const userSnap = await getDoc(userRef);

if (!userSnap.exists()) {

    await setDoc(userRef, {

        name: user.displayName,
        email: user.email,
        coins: 0,
        xp: 0,
        level: 1,
        energy: 100

    });

    console.log("✅ New User Created");

} else {

    console.log("✅ Existing User");

    const userData = userSnap.data();

    localStorage.setItem("coins", userData.coins);
    localStorage.setItem("xp", userData.xp);
    localStorage.setItem("level", userData.level);
    localStorage.setItem("energy", userData.energy);

}

alert("Welcome " + user.displayName);

    }catch(error){

        console.log(error);

        alert(error.message);

    }

});
}

async function saveGameData() {

    const uid = localStorage.getItem("uid");

    if (!uid) return;

    const userRef = doc(db, "users", uid);

    await updateDoc(userRef, {

        coins: Number(localStorage.getItem("coins")) || 0,
        xp: Number(localStorage.getItem("xp")) || 0,
        level: Number(localStorage.getItem("level")) || 1,
        energy: Number(localStorage.getItem("energy")) || 100

    });

    console.log("✅ Game Saved");

}

</script>


<script src="script.js"></script>
